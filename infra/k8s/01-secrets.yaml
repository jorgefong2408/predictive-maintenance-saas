# Plantilla — NO commitear valores reales.
# Generar en el cluster con, por ejemplo:
#   kubectl create secret generic predictmaint-secrets -n predictmaint \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=APP_DB_PASSWORD=$(openssl rand -hex 24) \
#     --from-literal=JWT_SECRET_KEY=$(openssl rand -hex 32)
# o gestionarlo con External Secrets Operator / AWS Secrets Manager en un
# despliegue real. Este archivo documenta las claves esperadas.
#
# POSTGRES_PASSWORD: la del rol admin/superusuario (POSTGRES_USER del
#   contenedor postgres) — solo lo usa el initContainer de migración.
# APP_DB_PASSWORD: la del rol restringido predictmaint_app (creado por la
#   migración 52dbcb3527ef) — el que sirve requests reales, sujeto a
#   Row-Level Security. Deben ser contraseñas DISTINTAS.
apiVersion: v1
kind: Secret
metadata:
  name: predictmaint-secrets
  namespace: predictmaint
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  APP_DB_PASSWORD: change-me-too
  JWT_SECRET_KEY: change-me
