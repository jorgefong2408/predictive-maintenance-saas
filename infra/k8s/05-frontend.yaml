# VITE_API_URL/VITE_WS_URL quedan quemadas en el bundle en build time (ver
# frontend/Dockerfile ARG); si el dominio cambia hay que reconstruir la
# imagen con esos build-args, no solo redeployar.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: predictmaint
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/jorgefong2408/predictive-maintenance-saas/frontend:latest
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: predictmaint
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
