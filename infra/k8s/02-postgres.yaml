apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: predictmaint
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: predictmaint
spec:
  replicas: 1  # TimescaleDB de un solo nodo; para HA real usar un operador (ej. CloudNativePG)
  selector:
    matchLabels: { app: postgres }
  strategy:
    type: Recreate  # evita dos pods escribiendo al mismo PVC ReadWriteOnce
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: timescale/timescaledb:2.17.2-pg16
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: predictmaint }
            - { name: POSTGRES_DB, value: predictmaint }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: predictmaint-secrets, key: POSTGRES_PASSWORD }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "predictmaint"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: predictmaint
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
