apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: predictmaint
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts
  namespace: predictmaint
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: predictmaint
spec:
  replicas: 1  # backend store sqlite -> un solo réplica; para escalar, mover a Postgres
  selector:
    matchLabels: { app: mlflow }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: mlflow }
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.16.0
          args:
            - mlflow
            - server
            - --backend-store-uri=sqlite:////mlflow/mlflow.db
            - --default-artifact-root=mlflow-artifacts:/
            - --artifacts-destination=/mlartifacts
            - --host=0.0.0.0
            - --port=5000
          env:
            - { name: MLFLOW_SERVER_ALLOWED_HOSTS, value: "mlflow:*,mlflow.predictmaint.svc.cluster.local:*" }
          ports: [{ containerPort: 5000 }]
          volumeMounts:
            - { name: data, mountPath: /mlflow }
            - { name: artifacts, mountPath: /mlartifacts }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mlflow-data }
        - name: artifacts
          persistentVolumeClaim: { claimName: mlflow-artifacts }
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: predictmaint
spec:
  selector: { app: mlflow }
  ports: [{ port: 5000, targetPort: 5000 }]
