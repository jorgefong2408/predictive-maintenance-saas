services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: predictmaint
      POSTGRES_PASSWORD: predictmaint
      POSTGRES_DB: predictmaint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictmaint"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    # Debe coincidir con la versión de `mlflow` en pyproject.toml (cliente y
    # servidor no son intercambiables entre versiones mayores: 3.x introdujo
    # endpoints REST — ej. "logged models" — que un servidor 2.x no tiene).
    image: ghcr.io/mlflow/mlflow:v3.16.0
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root mlflow-artifacts:/
      --artifacts-destination /mlartifacts
      --host 0.0.0.0
      --port 5000
    environment:
      # Protección anti DNS-rebinding de MLflow 3.x valida el header Host;
      # "mlflow" (nombre DNS del servicio en la red de compose) no está en
      # su lista default (solo localhost/IPs privadas), hay que sumarlo.
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:*,localhost:*,127.0.0.1:*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
      - mlflow_artifacts:/mlartifacts

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "python scripts/migrate_with_lock.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      # Rol restringido (sin superusuario, sin BYPASSRLS) — el que de verdad
      # queda sujeto a Row-Level Security. Lo crea la migración 52dbcb3527ef
      # la primera vez que corre MIGRATION_DATABASE_URL (el rol admin).
      DATABASE_URL: postgresql+psycopg2://predictmaint_app:${APP_DB_PASSWORD:-predictmaint_app_insecure_default}@postgres:5432/predictmaint
      # Rol admin (el POSTGRES_USER del contenedor postgres, superusuario) —
      # solo para DDL de migraciones (ver backend/alembic/env.py). NUNCA usar
      # esta URL para servir requests: un superusuario de Postgres salta RLS
      # sin excepción, con o sin FORCE ROW LEVEL SECURITY.
      MIGRATION_DATABASE_URL: postgresql+psycopg2://predictmaint:predictmaint@postgres:5432/predictmaint
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-predictmaint_app_insecure_default}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-prod}
      CORS_ORIGINS: '["http://localhost:5173"]'
      RETRAIN_INTERVAL_HOURS: "24"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Semana 9: observabilidad. Métricas del backend en /metrics (formato
  # Prometheus, vía prometheus-fastapi-instrumentator).
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki

  # Logs centralizados: promtail lee los logs de TODOS los contenedores vía
  # el socket de Docker (sin instrumentar cada servicio) y los empuja a Loki;
  # se consultan desde el mismo Grafana (datasource "Loki").
  loki:
    image: grafana/loki:3.3.2
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.3.2
    volumes:
      - ./infra/observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  postgres_data:
  mlflow_data:
  mlflow_artifacts:
  grafana_data:
