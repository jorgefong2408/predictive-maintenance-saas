name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check backend ml load-testing

      - name: Train & registrar modelo champion (requerido por tests de predicción/admin)
        run: uv run python ml/pipelines/retrain.py

      - name: Test (pytest + coverage)
        run: uv run pytest backend/tests -v --cov --cov-report=term-missing

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  contract:
    name: Contrato de tipos (backend -> frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --frozen

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Exportar el esquema OpenAPI del backend
        run: uv run python backend/scripts/export_openapi.py

      - name: Regenerar los tipos de TypeScript desde el esquema
        working-directory: frontend
        run: npm run codegen

      - name: Verificar que frontend/src/lib/api-schema.ts está al día
        run: |
          if ! git diff --exit-code -- frontend/src/lib/api-schema.ts; then
            echo "::error::frontend/src/lib/api-schema.ts quedó desactualizado respecto a los schemas de Pydantic. Corré 'uv run python backend/scripts/export_openapi.py' y 'npm run codegen' (en frontend/), y commiteá el resultado."
            exit 1
          fi

  build-and-push:
    name: Build & push images (ghcr.io)
    runs-on: ubuntu-latest
    needs: [backend, frontend, contract]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }},ghcr.io/${{ github.repository }}/backend:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }},ghcr.io/${{ github.repository }}/frontend:latest

  # Semana 8: el despliegue a AWS (EKS/ECS) necesita credenciales de una
  # cuenta real (secrets AWS_ROLE_ARN, etc.) y da lugar a gasto en la nube —
  # deliberadamente no configurado aquí. Este job documenta dónde iría y
  # queda inactivo (`if: false`) hasta que se conecte una cuenta real.
  deploy:
    name: Deploy (AWS) — no configurado
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: false
    steps:
      - run: echo "Configurar credenciales de AWS y aplicar infra/k8s/ contra el cluster antes de habilitar este job."
