[project]
name = "predictive-maintenance-saas"
version = "0.1.0"
description = "Plataforma SaaS de mantenimiento predictivo (ingesta de sensores, detección de anomalías, predicción de RUL, dashboard multi-tenant)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
ml = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
    "xgboost>=3.4.1",
]
backend = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
default-groups = ["ml", "backend", "dev"]
