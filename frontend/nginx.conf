server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA: cualquier ruta que no sea un archivo real cae a index.html
        # (React Router resuelve /login, /assets/:id, etc. en el cliente).
        try_files $uri $uri/ /index.html;
    }
}
